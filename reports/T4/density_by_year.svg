  text.axis { font-size: 11px; fill: #565c65; }
  .series { fill: none; stroke-width: 1.8; stroke-linejoin: round; }
  .dot { stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #14171b; }
    .frame { stroke: #4a5058; }
    .grid { stroke: #262b31; }
    .zero, .ref { stroke: #6d747d; }
    text { fill: #d8dce1; }
    text.axis { fill: #9aa1a9; }
  }
</style>
