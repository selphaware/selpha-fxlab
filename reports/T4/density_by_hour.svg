<style>
  .bg { fill: #ffffff; }
  .frame { stroke: #b9bec6; fill: none; stroke-width: 1; }
  .grid { stroke: #e3e6ea; stroke-width: 1; }
  .zero { stroke: #8a9099; stroke-width: 1; stroke-dasharray: 4 3; }
  .ref { stroke: #8a9099; stroke-width: 1.2; stroke-dasharray: 6 4; }
