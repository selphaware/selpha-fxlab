  text.axis { font-size: 11px; fill: #565c65; }
  .series { fill: none; stroke-width: 1.8; stroke-linejoin: round; }
  .dot { stroke: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #14171b; }
    .frame { stroke: #4a5058; }
    .grid { stroke: #262b31; }
